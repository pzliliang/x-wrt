name: Build X-WRT for HY3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ecj fastjar file flex g++ gawk gettext git-core java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-distutils python3-pyelftools rsync subversion swig unzip wget zlib1g-dev device-tree-compiler

      - name: Configure and build
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 自动选择 HY3000 设备
          echo 'CONFIG_TARGET_mediatek=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y' >> .config
          
          # 添加常用插件（中文界面、流量监控）
          echo 'CONFIG_PACKAGE_luci-app-statistics=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-nlbwmon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          
          make defconfig
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xwrt-hy3000-firmware
          path: bin/targets/mediatek/filogic/*.bin
