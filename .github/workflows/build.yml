name: Build X‑WRT for HY3000

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile X‑WRT‑HY3000
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clean up runner disk (释放内存/磁盘，非常关键)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ecj fastjar file flex g++ gawk gettext git-core \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-pyelftools \
            rsync subversion swig unzip wget zlib1g-dev device-tree-compiler

      - name: Cache dl download directory
        uses: actions/cache@v4
        with:
          path: dl
          key: xwrt-dl-cache-hy3000
          restore-keys: |
            xwrt-dl-cache-

      - name: Configure & feeds(只更新必要feed，禁止‑a全部更新！)
        run: |
          touch .config

          # 设置目标设备 philips_hy3000
          echo 'CONFIG_TARGET_mediatek=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> .config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y' >> .config

          # ⚠️关键：不要 update -a！只更新需要的 feeds，防止内存爆炸
          ./scripts/feeds update packages luci x
          ./scripts/feeds install packages luci x

          # EMMC驱动
          echo 'CONFIG_PACKAGE_kmod-mmc=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-fs-ext4=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-fs-f2fs=y' >> .config
          echo 'CONFIG_PACKAGE_block-mount=y' >> .config

          # 插件+中文
          echo 'CONFIG_PACKAGE_luci-app-statistics=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-nlbwmon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config

          make defconfig

          echo "===== Check target device config ====="
          grep "philips_hy3000" .config
          grep CONFIG_TARGET .config | head -20

      - name: Start compile (强制‑j1 单线程防OOM)
        run: |
          make -j1 V=s

      - name: List firmware files
        run: |
          ls -la bin/targets/mediatek/filogic/
          if [ ! -d bin/targets/mediatek/filogic ] || [ -z "$(ls bin/targets/mediatek/filogic/*.bin 2>/dev/null)" ]; then
            echo "⚠️ 没有生成bin固件！"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: X‑WRT‑HY3000‑Firmware
          path: bin/targets/mediatek/filogic/*.bin
