name: Build X‑WRT for HY3000

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile X‑WRT‑HY3000
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout X‑WRT source code
        uses: actions/checkout@v4

      - name: Install compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ecj fastjar file flex g++ gawk gettext git-core \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-pyelftools \
            rsync subversion swig unzip wget zlib1g-dev device-tree-compiler

      - name: Cache dl download directory
        uses: actions/cache@v4
        with:
          path: dl
          key: xwrt-dl-cache-${{ github.sha }}
          restore-keys: |
            xwrt-dl-cache-

      - name: Configure target & feeds
        run: |
          # ========== 设置HY3000设备目标 ==========
          ./scripts/config --set-val CONFIG_TARGET_mediatek y
          ./scripts/config --set-val CONFIG_TARGET_mediatek_filogic y
          ./scripts/config --set-val CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000 y

          # ========== 更新并安装feeds软件源 ==========
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # ========== EMMC存储驱动支持 ==========
          ./scripts/config --set-val CONFIG_PACKAGE_kmod-mmc y
          ./scripts/config --set-val CONFIG_PACKAGE_kmod-fs-ext4 y
          ./scripts/config --set-val CONFIG_PACKAGE_kmod-fs-f2fs y
          ./scripts/config --set-val CONFIG_PACKAGE_block-mount y

          # ========== LuCI插件与中文界面 ==========
          ./scripts/config --set-val CONFIG_PACKAGE_luci-app-statistics y
          ./scripts/config --set-val CONFIG_PACKAGE_luci-app-nlbwmon y
          ./scripts/config --set-val CONFIG_PACKAGE_luci-i18n-base-zh-cn y

          make defconfig

          # 调试输出，确认配置生效
          echo "===== Check target device config ====="
          grep "philips_hy3000" .config
          grep CONFIG_TARGET .config | head -20

      - name: Start compile firmware
        run: |
          # 如果经常莫名崩溃就改成 make -j1 V=s
          make -j2 V=s

      - name: List generated firmware files
        run: |
          ls -la bin/targets/mediatek/filogic/
          if [ ! -d bin/targets/mediatek/filogic ] || [ -z "$(ls bin/targets/mediatek/filogic/*.bin 2>/dev/null)" ]; then
            echo "⚠️ 没有生成bin固件文件！编译失败或者目标配置错误！"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: X‑WRT‑HY3000‑Firmware
          path: bin/targets/mediatek/filogic/*.bin
